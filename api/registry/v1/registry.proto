syntax = "proto3";

package registry.v1;

// Registry is the protobuf publish gate. It stores immutable schema
// versions and answers compatibility questions with descriptor-level
// evidence for both the binary wire encoding and the JSON mapping.
//
// The Go service in internal/registry implements exactly this surface
// (hand-wired ConnectRPC handlers with a JSON codec, no codegen step);
// this file is the canonical contract for clients and future codegen.
service Registry {
  // RegisterVersion publishes an immutable version. The same version with
  // different content is rejected (AlreadyExists); identical content is an
  // idempotent no-op. When a base version exists, the response carries an
  // evidence-based compatibility report. With require_compatible, a proven
  // INCOMPATIBLE version is refused before anything is stored.
  //
  // Cross-package imports are resolved against the registry itself: every
  // import not satisfied by the submitted files or the well-known types is
  // pinned to the registered version currently owning that path, and the
  // pin (package, version, content digest) is stored with the version.
  // Missing dependencies, dependency cycles, digest mismatches and diamond
  // version conflicts are rejected atomically (FailedPrecondition).
  rpc RegisterVersion(RegisterVersionRequest) returns (RegisterVersionResponse);

  // CheckCompatibility compares a registered base version against another
  // registered version or inline candidate files, optionally with sample
  // payloads and a consumer projection.
  rpc CheckCompatibility(CheckRequest) returns (CheckResponse);

  // DeclareConsumer records which messages/fields a consumer reads and
  // over which encoding, so checks can be projected onto that surface.
  rpc DeclareConsumer(DeclareConsumerRequest) returns (DeclareConsumerResponse);

  // ListVersions returns every registered version of a package.
  rpc ListVersions(ListVersionsRequest) returns (ListVersionsResponse);

  // AnalyzeImpact compares base->head of a package and walks the reverse
  // dependency graph: every package version holding a lock on the package
  // is classified DIRECT, TRANSITIVE or VERIFIED_UNAFFECTED, with the
  // reason paths leading to it. Analyses are persisted per exact input;
  // repeating one returns the stored result (reused=true).
  rpc AnalyzeImpact(AnalyzeImpactRequest) returns (AnalyzeImpactResponse);

  // ListDependencies returns the dependency locks captured when the given
  // version was registered. Locks are immutable: historical versions
  // always report the dependencies they were registered against.
  rpc ListDependencies(ListDependenciesRequest) returns (ListDependenciesResponse);
}

message ProtoFile {
  string path = 1;
  string content = 2;
}

message Sample {
  string name = 1;
  string message = 2;  // fully-qualified message name
  string encoding = 3; // "json" or "wire"
  string data = 4;     // JSON text, or base64 for wire
}

message Finding {
  string code = 1;
  string severity = 2;   // FAIL | WARN | INFO
  string dimension = 3;  // WIRE | JSON | BOTH
  string message = 4;    // fully-qualified message/enum name
  string path = 5;       // field path within the message
  string detail = 6;
}

message Report {
  string verdict = 1; // COMPATIBLE | NEEDS_REVIEW | INCOMPATIBLE
  repeated Finding findings = 2;
}

message RegisterVersionRequest {
  string package = 1;
  string version = 2;
  repeated ProtoFile files = 3;
  string base_version = 4;          // default: latest registered
  repeated Sample samples = 5;
  bool require_compatible = 6;
}

message RegisterVersionResponse {
  string package = 1;
  string version = 2;
  string content_hash = 3;
  bool already_existed = 4;
  string base_version = 5;
  Report compatibility = 6;
}

message CheckRequest {
  string package = 1;
  string base_version = 2;
  string candidate_version = 3;        // or:
  repeated ProtoFile candidate_files = 4;
  repeated Sample samples = 5;
  string consumer = 6;
}

message CheckResponse {
  string base_version = 1;
  string head_version = 2;
  Report report = 3;
  ConsumerImpact consumer_impact = 4;
}

message ConsumerImpact {
  string consumer = 1;
  string encoding = 2;
  string verdict = 3;
  repeated Finding findings = 4;
}

message Usage {
  string message = 1;        // fully-qualified message name
  repeated string fields = 2; // field paths; empty = whole message
}

message DeclareConsumerRequest {
  string package = 1;
  string consumer = 2;
  string encoding = 3; // wire | json | both
  repeated Usage usages = 4;
}

message DeclareConsumerResponse {
  bool declared = 1;
}

message ListVersionsRequest {
  string package = 1;
}

message VersionMeta {
  string version = 1;
  string content_hash = 2;
  string created_at = 3;
}

message ListVersionsResponse {
  string package = 1;
  repeated VersionMeta versions = 2;
}

// --- cross-package dependency locking & transitive impact analysis ---

message LockedDep {
  string package = 1;
  string version = 2;
  string content_hash = 3; // hex digest captured when the lock was taken
}

message PathHop {
  string package = 1;
  string version = 2;
}

// ReasonPath is one dependency chain from the changed package to an
// affected package. Diamonds yield several reason paths for one record.
message ReasonPath {
  repeated PathHop hops = 1;
}

message PackageImpact {
  string package = 1;
  string version = 2;  // the dependent version that was evaluated
  string impact = 3;   // DIRECT | TRANSITIVE | VERIFIED_UNAFFECTED
  repeated ReasonPath reason_paths = 4;
  repeated Finding findings = 5; // findings relevant to this dependent
}

message AnalyzeImpactRequest {
  string package = 1;
  string base_version = 2;
  string head_version = 3;
}

message AnalyzeImpactResponse {
  string package = 1;
  string base_version = 2;
  string head_version = 3;
  Report report = 4; // the package's own base->head report
  repeated PackageImpact impacts = 5;
  bool reused = 6;   // true when the stored analysis was returned
}

message ListDependenciesRequest {
  string package = 1;
  string version = 2;
}

message ListDependenciesResponse {
  string package = 1;
  string version = 2;
  repeated LockedDep dependencies = 3;
}
